<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f7f5"><title>Оригинал PDF · ГИА.мед</title><style>
:root{color-scheme:light dark;--bg:#f1f5f3;--card:#fff;--text:#20352d;--muted:#526760;--accent:#146c50;--line:#d6e3dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1050px;margin:auto;padding:20px 12px 45px}header{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}h1{font-size:21px;margin:0 0 6px}p{margin:7px 0;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.09em;font-weight:750;color:var(--accent)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}a,button{font:inherit;font-weight:650;color:var(--accent)}a.action,button{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);text-decoration:none;cursor:pointer}a.action:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}figure{margin:0 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}figcaption{padding:10px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}img{display:block;width:100%;height:auto;background:white}#status{padding:12px 5px}#status:empty{display:none}.page-scroll{overflow-x:auto}.page-scroll.zoom img{width:170%;max-width:none}.note{font-size:12px}@media(prefers-color-scheme:dark){:root{--bg:#121c18;--card:#1c2923;--text:#e4eee8;--muted:#b4c6bc;--accent:#8ad4b4;--line:#394d43}}@media(max-width:420px){main{padding:10px 8px 25px}header{padding:14px}h1{font-size:19px}.actions{gap:6px}.actions a,.actions button{font-size:13px}}
</style></head><body><main><header><div class="eyebrow">ГИА.МЕД · СИБГМУ, 2025</div><h1 id="heading">Оригинал PDF</h1><p id="pages"></p><p class="note">Изображения исходных страниц, без перепечатки текста. Для увеличения используй жест масштабирования или кнопку ниже.</p><div class="actions"><a class="action" id="full" href="./source.pdf" target="_blank" rel="noopener noreferrer">Открыть полный PDF ↗</a><button id="zoom" type="button" aria-pressed="false">Увеличить</button></div><p class="note">Чтобы продолжить тест, вернись в предыдущую вкладку или окно приложения.</p></header><p id="status" role="status" aria-live="polite">Загрузка страниц…</p><div id="content"></div><noscript><p>Для просмотра страниц нужен JavaScript. <a href="./source.pdf">Открыть полный PDF</a>.</p></noscript></main><script>
(()=>{'use strict';const params=new URLSearchParams(location.search);const first=Number(params.get('page')),last=Number(params.get('end')||first),q=Number(params.get('q'));const status=document.getElementById('status'),content=document.getElementById('content'),full=document.getElementById('full'),zoom=document.getElementById('zoom');
if(!Number.isInteger(first)||!Number.isInteger(last)||first<7||last>167||last<first||last-first>1){status.textContent='Не удалось определить страницу. Открой полный PDF.';zoom.hidden=true;return;}
if(Number.isInteger(q)&&q>=1&&q<=1049)document.getElementById('heading').textContent='Вопрос № '+q+' · оригинал';
const printed=first===last?String(first-2):`${first-2}–${last-2}`,physical=first===last?String(first):`${first}–${last}`;
document.getElementById('pages').textContent=`Стр. ${printed} в документе · страницы ${physical} в PDF-просмотрщике`;
full.href=new URL('./source.pdf#page='+first,location.href).href;
const files=new Set();for(let p=first;p<=last;p++){const start=7+40*Math.floor((p-7)/40);files.add('source-pages-'+String(start).padStart(3,'0')+'.js');}
const load=name=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='./'+name;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
let zoomed=false;zoom.addEventListener('click',()=>{zoomed=!zoomed;zoom.textContent=zoomed?'Уменьшить':'Увеличить';zoom.setAttribute('aria-pressed',String(zoomed));for(const x of content.querySelectorAll('.page-scroll'))x.classList.toggle('zoom',zoomed)});
Promise.all([...files].map(load)).then(()=>{for(let p=first;p<=last;p++){const src=window.GIA_SOURCE_PAGES?.[p];if(!src)throw Error('page missing');const figure=document.createElement('figure'),cap=document.createElement('figcaption'),wrap=document.createElement('div'),img=document.createElement('img');cap.textContent=`Страница ${p-2} оригинала (PDF: ${p})`;wrap.className='page-scroll'+(zoomed?' zoom':'');img.src=src;img.alt=`Оригинальная страница ${p-2} программы ГИА СибГМУ`;img.decoding='async';img.addEventListener('error',()=>{status.textContent='Изображение не загрузилось. Открой полный PDF.'});wrap.append(img);figure.append(cap,wrap);content.append(figure)}status.textContent='';}).catch(()=>{status.textContent='Не удалось загрузить страницы. Проверь интернет или открой полный PDF.'});})();
</script></body></html>
